<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        /* Event Banner */
        .banner {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .banner h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .banner p {
            font-size: 20px;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e3c72;
        }

        /* Schedule using Flexbox */
        .schedule {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .event-card {
            background: white;
            padding: 25px;
            flex: 1;
            min-width: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .event-card h3 {
            color: #2a5298;
            margin-bottom: 10px;
        }

        .event-card p {
            margin: 8px 0;
        }

        /* Registration Button */
        .register {
            text-align: center;
            margin-top: 35px;
        }

        .register a {
            display: inline-block;
            padding: 14px 30px;
            background: #1e3c72;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
        }

        .register a:hover {
            background: #2a5298;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .banner {
                padding: 40px 15px;
            }

            .banner h1 {
                font-size: 30px;
            }

            .banner p {
                font-size: 16px;
            }

            .schedule {
                flex-direction: column;
            }

            .event-card {
                width: 100%;
            }

            .container {
                width: 95%;
                margin: 25px auto;
            }
        }

        @media (max-width: 480px) {
            .banner h1 {
                font-size: 25px;
            }

            .banner p {
                font-size: 14px;
            }

            .event-card {
                padding: 20px;
            }

            .register a {
                width: 100%;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <section class="banner">
        <h1>TECHNOVA 2026</h1>
        <p>Annual College Technical & Cultural Event</p>
    </section>

    <main class="container">

        <h2>Event Schedule</h2>

        <section class="schedule">

            <div class="event-card">
                <h3>09:00 AM</h3>
                <p><strong>Inauguration</strong></p>
                <p>College Auditorium</p>
            </div>

            <div class="event-card">
                <h3>11:00 AM</h3>
                <p><strong>Technical Quiz</strong></p>
                <p>Seminar Hall</p>
            </div>

            <div class="event-card">
                <h3>02:00 PM</h3>
                <p><strong>Project Expo</strong></p>
                <p>Block A</p>
            </div>

            <div class="event-card">
                <h3>04:00 PM</h3>
                <p><strong>Cultural Program</strong></p>
                <p>Open Auditorium</p>
            </div>

        </section>

        <div class="register">
            <a href="#">Register Now</a>
        </div>

    </main>

</body>
</html>
